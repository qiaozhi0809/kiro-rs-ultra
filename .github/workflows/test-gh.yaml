name: Test (GitHub-hosted)

# 临时：用 GitHub 托管 runner 验证（self-hosted runner 调试期间备用）。
# 仅手动触发，验证完即可删除。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-test-gh"
          cache-on-failure: true

      # rust-embed 的 #[folder = "admin-ui/dist"] 在编译期要求目录存在。
      - name: Create placeholder admin-ui/dist
        run: mkdir -p admin-ui/dist

      - name: Run tests
        run: cargo test --locked
