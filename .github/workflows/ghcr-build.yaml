name: Build Docker image to GHCR (multi-arch)

# Build linux/amd64 + linux/arm64 images on native runners and push to GHCR.
# Authentication uses the built-in GITHUB_TOKEN — no extra secrets required.
# Server can `docker pull ghcr.io/<owner>/<repo>:latest` directly.

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [master]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push (${{ matrix.arch }})
    # 仅当 Test 工作流成功完成时才构建；tag / manual dispatch 也允许直通
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run 触发时默认拿默认分支 HEAD；显式对齐到触发 Test 的那次 commit
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image ref
        id: img
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "ref=${REGISTRY}/$(echo "$OWNER/$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Determine version tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
          fi
          echo "value=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          tags: |
            ${{ steps.img.outputs.ref }}:${{ matrix.arch }}
            ${{ steps.img.outputs.ref }}:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=kiro.rs multi-arch image

  manifest:
    name: Create multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image ref
        id: img
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "ref=${REGISTRY}/$(echo "$OWNER/$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Determine version tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
          fi
          echo "value=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create & push multi-arch manifest (latest)
        run: |
          IMAGE="${{ steps.img.outputs.ref }}"
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            "${IMAGE}:amd64" \
            "${IMAGE}:arm64"

      - name: Create & push multi-arch manifest (versioned)
        run: |
          IMAGE="${{ steps.img.outputs.ref }}"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
