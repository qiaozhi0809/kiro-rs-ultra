name: Test

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
      - 'config.example.json'
      - '.vscode/**'
      - '.idea/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # rust-embed 的 #[folder = "admin-ui/dist"] 在编译期要求目录存在。
      # 测试只验证后端逻辑、不需要真实前端产物，建一个空目录即可，避免拉起 bun build。
      - name: Create placeholder admin-ui/dist
        run: mkdir -p admin-ui/dist

      - name: Run tests
        run: cargo test --locked
